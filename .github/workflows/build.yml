name: Build and test
# workflow_dispatch: a run on main whose nuget-package artifact is built from a
# commit on main, for the GitHub prereleases (docs/nuget-package.md).
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build-vcpkg-cache
jobs:
  e2e-runner-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test E2E runner offline contracts (no hardware or credentials)
        run: python tests/e2e_runner_tests.py
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shared: ['OFF', 'ON']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependency binaries
        uses: actions/cache@v4
        with:
          path: build-vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          # vcpkg checks package ABI hashes; reuse unchanged binaries across manifest updates.
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          mkdir -p build-vcpkg-cache
          git clone https://github.com/microsoft/vcpkg.git build-tools/vcpkg
          git -C build-tools/vcpkg checkout 434307da09bc05b2c86996dccc8b2351fc0d5d37
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c 'build-tools\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
          else
            build-tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
      - name: Install Secret Service test dependencies (Linux)
        # libsecret enables the Linux built-in credential store (D59); GNOME
        # Keyring and a session bus let its tests reach a real Secret Service.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libsecret-tools gnome-keyring dbus
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=build-tools/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test (Linux, session bus with an unlocked keyring)
        if: runner.os == 'Linux'
        env:
          SAP2_REQUIRE_SECRET_SERVICE: '1'
        run: dbus-run-session -- bash ./tests/with_test_keyring.sh ctest --test-dir build -C Release --output-on-failure
  uwp:
    # The AppContainer library for packaged hosts (docs/uwp-native-build.md):
    # build only. Its programs cannot run outside a package; receiver use is
    # validated through the packaged UWP test host, not here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, platform: x64, machine: x64 }
          - { arch: x86, platform: Win32, machine: x86 }
          - { arch: arm64, platform: ARM64, machine: ARM64 }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependency binaries
        uses: actions/cache@v4
        with:
          path: build-vcpkg-cache
          key: vcpkg-uwp-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-uwp-${{ matrix.arch }}-
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          mkdir -p build-vcpkg-cache
          git clone https://github.com/microsoft/vcpkg.git build-tools/vcpkg
          git -C build-tools/vcpkg checkout 434307da09bc05b2c86996dccc8b2351fc0d5d37
          MSYS_NO_PATHCONV=1 cmd.exe /c 'build-tools\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
      - name: Configure (WindowsStore, ${{ matrix.arch }}-uwp)
        run: cmake -S . -B build-uwp -A ${{ matrix.platform }} "-DCMAKE_SYSTEM_NAME=WindowsStore" "-DCMAKE_SYSTEM_VERSION=10.0" -DBUILD_SHARED_LIBS=ON "-DCMAKE_TOOLCHAIN_FILE=build-tools/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-uwp "-DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/vcpkg-overlays/ports"
      - name: Build
        run: cmake --build build-uwp --config Release
      - name: Check AppContainer, app C runtime and imports
        run: ./scripts/check_uwp_binaries.ps1 -Directory build-uwp/Release -Machine ${{ matrix.machine }}
      - name: Keep the native libraries and notices for the package
        uses: actions/upload-artifact@v4
        with:
          name: uwp-${{ matrix.arch }}
          path: |
            build-uwp/Release/send_airplay2.dll
            build-uwp/Release/libcrypto-*.dll
            build-uwp/Release/send_airplay2.source.txt
            build-uwp/vcpkg_installed/${{ matrix.arch }}-uwp/share/openssl/copyright
            build-uwp/vcpkg_installed/${{ matrix.arch }}-uwp/share/botan/copyright
            build-uwp/vcpkg_installed/${{ matrix.arch }}-uwp/share/boost-asio/copyright
          if-no-files-found: error
          retention-days: 14
  nuget:
    # The SendAirPlay2 package with all three UWP architectures
    # (docs/nuget-package.md), as an artifact; nothing is published.
    needs: uwp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: uwp-*
          path: build-ci-uwp
      - name: Pack
        run: ./scripts/pack_nuget.ps1 -Native 'x64=build-ci-uwp/uwp-x64/Release','x86=build-ci-uwp/uwp-x86/Release','arm64=build-ci-uwp/uwp-arm64/Release' -VcpkgShare build-ci-uwp/uwp-x64/vcpkg_installed/x64-uwp/share -VersionSuffix "ci.${{ github.run_number }}" -OutputDirectory build-ci-package
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: build-ci-package/*.nupkg
          if-no-files-found: error
          retention-days: 14
  audio-codec-spike:
    # Optional probe and explicitly enabled core integration checks. Baseline
    # package artifacts remain codec-free; these jobs do not publish a package.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: desktop, triplet: x64-windows-codec-release }
          - { kind: uwp, triplet: x64-uwp-codec-release }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore codec dependency binaries
        id: codec-cache
        uses: actions/cache/restore@v4
        with:
          path: build-vcpkg-cache
          # A run-specific key can save newly built ABIs after a partial failure.
          # vcpkg validates every restored package's ABI, including compiler/profile.
          key: vcpkg-codec-release-v1-${{ matrix.kind }}-${{ hashFiles('tools/audio-codec-spike/vcpkg.json', 'tools/audio-codec-spike/triplets/**', 'vcpkg-overlays/ports/ffmpeg/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-codec-release-v1-${{ matrix.kind }}-${{ hashFiles('tools/audio-codec-spike/vcpkg.json', 'tools/audio-codec-spike/triplets/**', 'vcpkg-overlays/ports/ffmpeg/**') }}-
            vcpkg-codec-release-v1-${{ matrix.kind }}-
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          mkdir -p build-vcpkg-cache
          git clone https://github.com/microsoft/vcpkg.git build-tools/vcpkg
          git -C build-tools/vcpkg checkout 434307da09bc05b2c86996dccc8b2351fc0d5d37
          MSYS_NO_PATHCONV=1 cmd.exe /c 'build-tools\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
      - name: Configure isolated Release probe
        shell: pwsh
        run: |
          $probeArguments = @(
            '-S', 'tools/audio-codec-spike', '-B', 'build-codec', '-A', 'x64',
            '-DBUILD_TESTING=ON',
            '-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/build-tools/vcpkg/scripts/buildsystems/vcpkg.cmake',
            '-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}',
            '-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/tools/audio-codec-spike/triplets',
            '-DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/vcpkg-overlays/ports'
          )
          if ('${{ matrix.kind }}' -eq 'uwp') {
            $probeArguments += '-DCMAKE_SYSTEM_NAME=WindowsStore', '-DCMAKE_SYSTEM_VERSION=10.0'
          }
          cmake @probeArguments
      - name: Build and test desktop probe
        if: matrix.kind == 'desktop'
        run: |
          cmake --build build-codec --config Release --target sap2_codec_probe_tests sap2_audio_decoder_tests sap2_expanded_decoder_tests sap2_expanded_hls_tests sap2_coarse_clock_tests sap2_pcm_index_tests sap2_compressed_index_tests sap2_compact_index_tests sap2_stereo_aac_hls_tests sap2_stereo_aac_readiness_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-codec -C Release -R '^(audio_(codec_probe|decoder_source)|expanded_audio_(decoder|hls)|coarse_matroska_clock|matroska_(pcm|compressed|compact)_index|stereo_aac_(hls|readiness))$' --output-on-failure
      - name: Build and inspect AppContainer probe
        if: matrix.kind == 'uwp'
        run: |
          cmake --build build-codec --config Release --target sap2_codec_probe sap2_audio_decoder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/audio-codec-spike/check_binaries.ps1 -Directory build-codec/Release
      - name: Configure explicit stereo AAC playback integration
        shell: pwsh
        run: |
          $stereoArguments = @(
            '-S', '.', '-B', 'build-stereo', '-A', 'x64',
            '-DBUILD_SHARED_LIBS=ON', '-DBUILD_TESTING=ON', '-DSAP2_STEREO_AAC=ON', '-DSAP2_RUNTIME_VALIDATION=ON',
            '-DVCPKG_MANIFEST_FEATURES=stereo-aac',
            '-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/build-tools/vcpkg/scripts/buildsystems/vcpkg.cmake',
            '-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}',
            '-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/tools/audio-codec-spike/triplets',
            '-DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/vcpkg-overlays/ports'
          )
          if ('${{ matrix.kind }}' -eq 'uwp') {
            $stereoArguments += '-DCMAKE_SYSTEM_NAME=WindowsStore', '-DCMAKE_SYSTEM_VERSION=10.0'
          }
          cmake @stereoArguments
      - name: Build and test enabled playback integration
        shell: pwsh
        run: |
          cmake --build build-stereo --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.kind }}' -eq 'desktop') {
            ctest --test-dir build-stereo -C Release --output-on-failure
          } else {
            ./scripts/check_uwp_binaries.ps1 -Directory build-stereo/Release -StereoAac
          }
      - name: Save completed codec dependency binaries even after a later failure
        if: ${{ !cancelled() && hashFiles('build-vcpkg-cache/**/*.zip') != '' && steps.codec-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build-vcpkg-cache
          key: ${{ steps.codec-cache.outputs.cache-primary-key }}
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependency binaries
        uses: actions/cache@v4
        with:
          path: build-vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned vcpkg
        run: |
          mkdir -p build-vcpkg-cache
          git clone https://github.com/microsoft/vcpkg.git build-tools/vcpkg
          git -C build-tools/vcpkg checkout 434307da09bc05b2c86996dccc8b2351fc0d5d37
          build-tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=build-tools/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
